[package]
name = "openshell-sandbox"
description = "OpenShell process sandbox and monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "openshell-sandbox"
path = "src/main.rs"

[dependencies]
openshell-core = { path = "../openshell-core" }
openshell-ocsf = { path = "../openshell-ocsf" }
openshell-policy = { path = "../openshell-policy" }
openshell-router = { path = "../openshell-router" }

# Async runtime
tokio = { workspace = true }

# gRPC
tonic = { workspace = true, features = ["channel", "tls"] }
tokio-stream = { workspace = true }

# CLI
clap = { workspace = true }

# Error handling
miette = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
hmac = "0.12"
sha2 = { workspace = true }
hex = "0.4"
russh = "0.57"
rand_core = "0.6"
# Version pin: prevents fresh resolves from picking pkcs8 0.11.0-rc.12 / 0.11.0
# final, which breaks rsa 0.10.0-rc.12 (pulled in by russh) on macOS.
# rsa 0.10.0-rc.12 requires pkcs8 ^0.11.0-rc.8; rc.11 satisfies that and is
# the version in Cargo.lock.  Declaring it here makes the constraint visible to
# the resolver even when --locked is not passed.
pkcs8 = { workspace = true }

# OPA policy evaluation (no default features — full-opa pulls in opa-runtime which requires git in build)
regorus = { version = "0.9", default-features = false, features = ["std", "arc", "glob", "yaml"] }

# TLS
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rcgen = { workspace = true }
webpki-roots = { workspace = true }

# HTTP (outbound — for interactive-enforcement decision client)
reqwest = { workspace = true }
bytes = { workspace = true }

# UUID (workspace dep includes v4 feature)
uuid = { workspace = true }

# Encoding
base64 = { workspace = true }
flate2 = "1"
sha1 = "0.10"

# IP network / CIDR parsing
ipnet = "2"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
apollo-parser = { workspace = true }
glob = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Unix/Process
nix = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
temp-env = "0.3"
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
wiremock = "0.6"
serial_test = "3"

[lints]
workspace = true
